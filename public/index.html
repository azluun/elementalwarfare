<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Duel</title>
<style>
  :root{
    --bg:#0f1310; --panel:#182019; --panel2:#20291f; --line:#2c3828;
    --ink:#e9ecdf; --soft:#9aa389; --accent:#54b483; --amber:#e0a24b;
    --you:#54b483; --foe:#e2564f; --shield:#4fb3c0; --new:#f0708a;
    --dsp:"Fraunces",Georgia,serif; --body:"Spline Sans","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.4;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:16px}
  h1{font-family:var(--dsp);font-weight:600;margin:0;font-size:clamp(24px,6vw,34px);letter-spacing:-.02em}
  h1 .z{color:var(--foe)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;
    transition:transform .07s,background .15s,opacity .15s}
  button:hover:not(:disabled){background:var(--line)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  input{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;font-size:14px;width:100%}
  label{font-size:12px;color:var(--soft);display:block;margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}

  /* ---- lobby ---- */
  .lobby{max-width:380px;margin:auto;display:flex;flex-direction:column;gap:14px;width:100%}
  .lobby .row{display:flex;gap:8px}
  .lobby .row button{flex:1}
  .invite{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
  .invite code{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:8px;margin-top:6px;word-break:break-all;color:var(--accent);font-size:12px}
  .status{color:var(--amber);font-size:13px;text-align:center;min-height:18px}

  /* ---- arena ---- */
  .arena{display:none;flex-direction:column;gap:12px;flex:1}
  .fighter{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .fighter .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
  .foe .name{color:var(--foe)} .me .name{color:var(--you)}
  .hpwrap{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
  .hp{height:100%;transition:width .3s}
  .foe .hp{background:var(--foe)} .me .hp{background:var(--you)}
  .shields{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;min-height:26px}
  .chip{background:var(--bg);border:1px solid var(--shield);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--shield)}
  .foecount{font-size:12px;color:var(--soft)}
  .lockwarn{color:var(--foe);font-size:12px;margin-top:4px;min-height:15px}

  .log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
    height:86px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column-reverse;gap:3px}
  .log div{color:var(--soft)} .log div:first-child{color:var(--ink)}

  .craft{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .bases{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .base{width:60px;height:60px;border-radius:12px;font-size:26px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;line-height:1}
  .base small{font-size:10px;color:var(--soft);font-weight:600}
  .base.locked{opacity:.3;pointer-events:none;border-color:var(--foe)}
  .combine{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px}
  .slot{width:56px;height:56px;border:1.5px dashed var(--line);border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-size:24px;color:var(--soft);cursor:pointer}
  .slot.full{border-style:solid;border-color:var(--accent)}
  .op{font-family:var(--dsp);font-size:22px;color:var(--soft)}
  .hint{text-align:center;font-size:12px;color:var(--soft);min-height:16px;margin-top:6px}
  .turnbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:8px 12px;font-weight:700}
  .turnbar.mine{border-color:var(--accent)} .turnbar.theirs{opacity:.7}
  #roundmsg{flex:1} .turnbar.mine #roundmsg{color:var(--you)} .turnbar.theirs #roundmsg{color:var(--soft)}
  #timer{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--soft)}
  .apdots{display:flex;gap:4px}
  .apdots span{width:12px;height:12px;border-radius:50%;background:var(--line)}
  .apdots span.on{background:var(--amber)}
  #ready{background:var(--accent);color:#0e120a;border-color:transparent}
  #ready:disabled{opacity:.4;background:var(--panel2);color:var(--ink)}
  .craft.off{opacity:.45;pointer-events:none}
  .planstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;
    background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
  .planlabel{font-size:12px;font-weight:700;color:var(--soft)}
  .planhint{font-size:12px;color:var(--soft)}
  .stchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    border-radius:8px;padding:3px 6px 3px 9px;border:1px solid var(--line)}
  .stchip.attack{border-color:var(--foe);color:var(--foe)}
  .stchip.shield{border-color:var(--shield);color:var(--shield)}
  .stchip.curse{border-color:var(--amber);color:var(--amber)}
  .stchip button{background:transparent;border:none;color:inherit;padding:0 2px;font-size:13px;cursor:pointer}

  .hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;
    display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer}
  .card:hover{border-color:var(--accent)}
  .card.item{opacity:.92}
  .card .em{font-size:26px;line-height:1}
  .card .cn{font-size:11.5px;font-weight:700}
  .card .cd2{font-size:10px;color:var(--soft)}
  .card.attack{border-color:var(--foe)} .card.shield{border-color:var(--shield)} .card.curse{border-color:var(--amber)}
  .card button{width:100%;padding:5px;font-size:11px;margin-top:2px}
  .emptyhand{color:var(--soft);font-size:13px;text-align:center;padding:10px}

  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shake{animation:shake .3s}
  /* reveal animation */
  .reveal{position:fixed;inset:0;background:rgba(8,10,7,.82);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:20px;z-index:20}
  .reveal.show{display:flex}
  .reveal.hitshake{animation:shake .32s}
  .rv-side{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:520px}
  .rv-name{font-weight:700;font-size:14px}
  .rv-name.foe{color:var(--foe)} .rv-name.me{color:var(--you)}
  .rv-hp{font-family:var(--dsp);font-size:26px;font-variant-numeric:tabular-nums;transition:color .2s}
  .rv-cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:74px}
  .rv-card{width:66px;height:70px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    opacity:0;transform:rotateY(90deg);transition:transform .35s,opacity .35s}
  .rv-card.up{opacity:1;transform:rotateY(0)}
  .rv-card .em{font-size:26px;line-height:1} .rv-card .nm{font-size:10px;font-weight:700;text-align:center}
  .rv-card.attack{border-color:var(--foe)} .rv-card.shield{border-color:var(--shield)} .rv-card.curse{border-color:var(--amber)}
  .rv-mid{min-height:44px;display:flex;align-items:center;justify-content:center;
    font-family:var(--dsp);font-size:20px;font-weight:600;text-align:center;padding:0 10px}
  .rv-mid .blk{color:var(--shield)} .rv-mid .hit{color:var(--foe)}
  @keyframes floatup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-46px)}}
  .dmgfloat{position:absolute;left:50%;top:6px;font-family:var(--dsp);font-weight:700;font-size:28px;
    color:var(--foe);animation:floatup .8s ease-out forwards;pointer-events:none}
  .over{position:fixed;inset:0;background:rgba(8,10,7,.86);display:none;align-items:center;justify-content:center;padding:20px;z-index:21}
  /* cheat sheet / recipe book */
  .sheet{position:fixed;inset:0;background:rgba(8,10,7,.86);display:flex;align-items:center;justify-content:center;padding:16px;z-index:25}
  .sheet[hidden]{display:none}
  .sheetbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:16px}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;position:sticky;top:-16px;background:var(--panel);padding-top:2px}
  .sheethead b{font-family:var(--dsp);font-size:18px}
  .sheethead button{background:var(--panel2);padding:4px 10px}
  .sheet h3{font-family:var(--dsp);font-size:13px;color:var(--soft);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
  .crow{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
  .crow .a{color:var(--foe);font-weight:600;flex:1} .crow .s{color:var(--shield);font-weight:600}
  .crow .arrow{color:var(--soft)}
  .rrow{font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
  .rrow .r{color:var(--soft)}
  .sheetnote{font-size:12px;color:var(--soft);margin-top:12px}
  .over .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;max-width:320px}
  .over h2{font-family:var(--dsp);margin:0 0 8px;font-size:28px}
  .chart{font-size:11px;color:var(--soft);text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <h1>Elemental&nbsp;Due<span class="z">l</span></h1>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="roomtag" style="font-size:12px;color:var(--soft)"></span>
      <button id="guide" style="padding:5px 10px;font-size:12px">📖 Guide</button>
    </div>
  </div>

  <!-- LOBBY -->
  <div class="lobby" id="lobby">
    <div><label for="name">Your name</label><input id="name" maxlength="16" placeholder="e.g. username"></div>
    <button class="pri" id="quick" style="background:var(--accent);color:#0e120a;border-color:transparent;padding:12px;font-size:15px">⚔️ Find match</button>
    <button id="bot" style="padding:11px;font-size:14px">🤖 Play vs Bot</button>
    <div style="text-align:center;color:var(--soft);font-size:12px">— or play a specific friend —</div>
    <div><label for="room">Room code</label><input id="room" maxlength="6" placeholder="you will see your code here" style="text-transform:uppercase"></div>
    <div class="row">
      <button id="create">Create room</button>
      <button id="joinbtn">Join room</button>
    </div>
    <div class="status" id="status"></div>
    <div class="invite" id="invite" hidden>
      Send this link to your friend:
      <code id="invitelink"></code>
    </div>
    <button id="book" style="padding:9px;font-size:13px">📖 Recipe Book — all recipes &amp; counters</button>
  </div>

  <!-- ARENA -->
  <div class="arena" id="arena">
    <div class="fighter foe">
      <div class="top"><span class="name" id="foename">Opponent</span><span id="foehp">30</span></div>
      <div class="hpwrap"><div class="hp" id="foebar" style="width:100%"></div></div>
      <div class="foecount" id="foeshields">Shields: 0</div>
    </div>

    <div class="log" id="log"></div>

    <div class="fighter me">
      <div class="top"><span class="name" id="myname">You</span><span id="myhp">30</span></div>
      <div class="hpwrap"><div class="hp" id="mybar" style="width:100%"></div></div>
      <div class="shields" id="myshields"></div>
      <div class="lockwarn" id="lockwarn"></div>
    </div>

    <div class="turnbar" id="turnbar">
      <span id="roundmsg">Round 1</span>
      <span id="timer"></span>
      <span class="apdots" id="apdots"></span>
      <button id="ready">Ready</button>
    </div>

    <div class="craft" id="craft">
      <div class="bases" id="bases"></div>
      <div class="combine">
        <div class="slot" id="s0"></div><span class="op">+</span><div class="slot" id="s1"></div>
      </div>
      <div class="hint" id="hint">Craft (1 AP) or stage a card (1 AP). Both players reveal at once.</div>
    </div>

    <div class="hand" id="hand"></div>
    <div class="planstrip" id="planstrip"></div>
  </div>
</div>

<div class="reveal" id="reveal"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheetbox">
    <div class="sheethead"><b id="sheettitle">Recipes</b><button id="sheetclose">✕</button></div>
    <div id="sheetbody"></div>
  </div>
</div>

<div class="over" id="over"><div class="box">
  <h2 id="overtitle">—</h2>
  <p id="oversub" style="color:var(--soft)"></p>
  <button class="pri" onclick="location.reload()" style="background:var(--accent);color:#0e120a;border-color:transparent">Rematch</button>
</div></div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Spline+Sans:wght@400;600;700&display=swap">

<script>
// ---- card definitions (mirror server ATTACKS for the offense numbers) ----
const BASE = { fire:"🔥", water:"💧", earth:"🌍", air:"💨" };
const CARDS = {
  // -- intermediates: elements you craft, then feed into the recipes below --
  steam:   {em:"♨️",name:"Steam", kind:"item",  recipe:["fire","water"], info:"ingredient → Life"},
  lava:    {em:"🌋",name:"Lava",  kind:"item",  recipe:["fire","earth"], info:"ingredient → Meteor"},
  energy:  {em:"⚡",name:"Energy",kind:"item",  recipe:["fire","air"],   info:"ingredient → Firebolt, Plague"},
  mud:     {em:"🟤",name:"Mud",   kind:"item",  recipe:["water","earth"],info:"ingredient → Plague"},
  // -- attacks --
  storm:   {em:"⛈️",name:"Storm",   kind:"attack",dmg:8, counter:"mountain",recipe:["water","air"],  info:"8 dmg · blocked by Mountain"},
  firebolt:{em:"🔥",name:"Firebolt",kind:"attack",dmg:6, counter:"ward",    recipe:["energy","fire"],info:"6 dmg · blocked by Ward"},
  meteor:  {em:"☄️",name:"Meteor",  kind:"attack",dmg:12,counter:"planet",  recipe:["lava","fire"],  info:"12 dmg · blocked by Planet"},
  plague:  {em:"🦠",name:"Plague",  kind:"attack",dmg:10,counter:"life",    recipe:["mud","energy"], info:"10 dmg · blocked by Life"},
  // -- shields (Mountain also advances into Planet) --
  mountain:{em:"⛰️",name:"Mountain",kind:"shield",recipe:["earth","air"],    info:"blocks Storm · or craft Planet"},
  ward:    {em:"💧",name:"Water Ward",kind:"shield",recipe:["water","water"],info:"blocks Firebolt"},
  planet:  {em:"🌐",name:"Planet",  kind:"shield",recipe:["mountain","earth"],info:"blocks Meteor"},
  life:    {em:"🌿",name:"Life",    kind:"shield",recipe:["steam","air"],    info:"blocks Plague"},
  // -- disruption --
  curse:   {em:"🌀",name:"Curse",   kind:"curse", recipe:["air","air"],      info:"locks an enemy element 6s"},
};
const RECIPE = {}; // "a+b" -> cardId
for (const [id,c] of Object.entries(CARDS)) RECIPE[c.recipe.slice().sort().join("+")] = id;
const EMO = (id) => BASE[id] || (CARDS[id] && CARDS[id].em) || "?";

// ---- lobby / connection ----
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.get("room")) $("room").value = params.get("room").toUpperCase();
$("name").value = localStorage.getItem("duel.name") || "";

let ws, myslot = 0, inv = {}, slots = [null,null];

// recipes you've crafted at least once — persists across games (per browser)
let discovered = new Set();
try { const d = JSON.parse(localStorage.getItem("duel.discovered")); if (Array.isArray(d)) discovered = new Set(d); } catch(e){}
function discover(id){
  if (discovered.has(id)) return;
  discovered.add(id);
  try { localStorage.setItem("duel.discovered", JSON.stringify([...discovered])); } catch(e){}
}

function randCode(){ let s=""; for(let i=0;i<4;i++) s+="ABCDEFGHJKLMNPQRSTUVWXYZ"[(Math.random()*24)|0]; return s; }

let quick = false;
function openSocket(firstMsg){
  const name = ($("name").value || "Player").trim();
  try{ localStorage.setItem("duel.name", name); }catch(e){}
  $("status").textContent = "Connecting…";
  ws = new WebSocket(location.origin.replace(/^http/,"ws"));
  ws.onopen = () => ws.send(JSON.stringify(firstMsg(name)));
  ws.onclose = () => $("status").textContent = "Disconnected.";
  ws.onmessage = (ev) => handle(JSON.parse(ev.data));
}
function connect(room){ quick = false; openSocket((name)=>({ type:"join", room, name })); showInvite(room); }
function quickmatch(){ quick = true; $("invite").hidden = true; openSocket((name)=>({ type:"quickmatch", name })); }
function botmatch(){ quick = true; $("invite").hidden = true; openSocket((name)=>({ type:"botmatch", name })); }
function showInvite(room){
  const url = location.origin + location.pathname + "?room=" + room;
  $("invitelink").textContent = url;
  $("invite").hidden = false;
  $("roomtag").textContent = "Room " + room;
}
$("quick").onclick = quickmatch;
$("bot").onclick = botmatch;
$("create").onclick = () => { const c = randCode(); $("room").value = c; connect(c); };
$("joinbtn").onclick = () => {
  const c = ($("room").value || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (!c) return $("status").textContent = "Enter a room code (or Create one).";
  connect(c);
};

// ---- message handling ----
function handle(m){
  if (m.type === "full")    return $("status").textContent = "That room is full.";
  if (m.type === "searching") $("status").textContent = "🔎 Searching for an opponent…";
  if (m.type === "joined")  { myslot = m.slot; if (quick) $("roomtag").textContent = "Matched"; else showInvite(m.code); }
  if (m.type === "waiting") $("status").textContent = quick ? "🔎 Searching for an opponent…" : "Waiting for your friend to join…";
  if (m.type === "left")    { $("overtitle").textContent = "Opponent left"; $("oversub").textContent=""; $("over").style.display="flex"; }
  if (m.type === "start")   { enterArena(); newRound(m); }
  if (m.type === "round")   { if (animating) pendingRound = m; else newRound(m); }
  if (m.type === "resolve") { startReveal(m); }
  if (m.type === "over")    { if (animating) pendingOver = m; else showOver(m); }
}
function showOver(m){
  const meName = ($("name").value || "Player").trim();
  const draw = m.winner === null, won = m.winner === meName;
  $("overtitle").textContent = draw ? "⚖️ Draw" : won ? "🏆 Victory" : "☠️ Defeated";
  $("oversub").textContent = draw ? "You both fell in the same round." : won ? "You crushed them." : m.winner + " won.";
  $("over").style.display = "flex";
}
function enterArena(){ $("lobby").style.display="none"; $("arena").style.display="flex"; }
function addLog(t){ const d=document.createElement("div"); d.textContent=t; $("log").prepend(d); }

// ---- round / plan state ----
let round = 0, apBudget = 0, apSpent = 0, plan = [], locked = false, myLock = null;
let animating = false, pendingRound = null, pendingOver = null, shownHp = [30,30], foeName = "Opponent";
const apLeft = () => apBudget - apSpent;
const canAct = () => !locked && apLeft() > 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function newRound(m){
  round = m.round; apBudget = m.ap; apSpent = 0; plan = []; locked = false;
  applyPlayers(m.players);
  if (round > 1) addLog(`— Round ${round} · ${apBudget} AP —`);
  slots = [null,null]; renderSlots();
  updateUI();
  startTimer(m.seconds);
}
function applyPlayers(players){
  const me = players[myslot], foe = players[1-myslot];
  $("myname").textContent = me.name + " (you)"; $("foename").textContent = foe.name;
  $("myhp").textContent = me.hp; $("foehp").textContent = foe.hp;
  $("mybar").style.width = (me.hp/30*100)+"%"; $("foebar").style.width = (foe.hp/30*100)+"%";
  $("myshields").innerHTML = me.shields.map(s=>`<span class="chip">${CARDS[s].em} ${CARDS[s].name}</span>`).join("") || "";
  $("foeshields").textContent = "Shields: " + foe.shields.length;
  myLock = me.lock;
  $("lockwarn").textContent = me.lock ? `⚠ ${me.lock.el} locked!` : "";
  shownHp = [players[0].hp, players[1].hp];
  foeName = foe.name;
}
function updateUI(){
  $("turnbar").className = "turnbar " + (locked ? "theirs" : "mine");
  $("roundmsg").textContent = locked ? "Waiting for opponent…" : `Round ${round} — plan`;
  $("apdots").innerHTML = [...Array(apBudget)].map((_,i)=>`<span class="${i<apLeft()?"on":""}"></span>`).join("");
  $("ready").textContent = locked ? "Locked in" : "Ready";
  $("ready").disabled = locked;
  $("craft").classList.toggle("off", !canAct());
  renderBases(); renderInv(); renderPlan();
}

// ---- crafting ----
function isLocked(el){ return myLock && myLock.el === el && myLock.until > Date.now(); }
function renderBases(){
  $("bases").innerHTML = "";
  for (const [el,em] of Object.entries(BASE)){
    const b = document.createElement("button");
    b.className = "base" + (isLocked(el) ? " locked":"");
    b.disabled = !canAct() || isLocked(el);
    b.innerHTML = `<span>${em}</span><small>${el}</small>`;
    b.onclick = () => addToSlot(el);
    $("bases").appendChild(b);
  }
}
function addToSlot(el){
  if (!canAct()){ $("hint").textContent = locked ? "Locked in — waiting for opponent." : "No AP left — hit Ready."; return; }
  if (isLocked(el)) return;
  const i = slots[0]===null?0 : slots[1]===null?1 : 0;
  if (i===0) slots=[el,null]; else slots[1]=el;
  renderSlots();
  if (slots[0] && slots[1]) craft();
}
function renderSlots(){
  $("s0").textContent = slots[0]?EMO(slots[0]):""; $("s0").className="slot"+(slots[0]?" full":"");
  $("s1").textContent = slots[1]?EMO(slots[1]):""; $("s1").className="slot"+(slots[1]?" full":"");
}
$("s0").onclick = () => { slots=[slots[1],null]; renderSlots(); };
$("s1").onclick = () => { slots[1]=null; renderSlots(); };

function craft(){
  const a = slots[0], b = slots[1];
  const id = RECIPE[[a,b].sort().join("+")];
  const clear = () => { slots=[null,null]; renderSlots(); };
  if (!canAct()){ clear(); return; }
  const need = {};
  [a,b].forEach(x => { if (!BASE[x]) need[x] = (need[x]||0)+1; });
  for (const k in need){
    if ((inv[k]||0) < need[k]){ $("hint").textContent=`Not enough ${CARDS[k].name}.`; flash(); clear(); return; }
  }
  if (!id){ $("hint").textContent="Those two make nothing."; flash(); clear(); return; }
  for (const k in need) inv[k] -= need[k];   // consume ingredients
  inv[id] = (inv[id]||0) + 1;                // gain the new element
  discover(id);                              // remember this recipe for your Guide
  apSpent++;
  $("hint").textContent = `Crafted ${CARDS[id].name}! (−1 AP)`;
  clear(); updateUI();
}
function flash(){ $("craft").classList.add("shake"); setTimeout(()=>$("craft").classList.remove("shake"),300); }

// ---- inventory: crafted elements you own (click to advance, button to stage this round) ----
function renderInv(){
  const h = $("hand");
  const ids = Object.keys(inv).filter(k => inv[k] > 0);
  if (!ids.length){ h.innerHTML = `<div class="emptyhand">No elements yet. Combine two above — crafted elements land here to advance or stage.</div>`; return; }
  h.innerHTML = "";
  ids.forEach(id => {
    const c = CARDS[id];
    const el = document.createElement("div");
    el.className = "card " + c.kind;
    el.title = "Click to add to the combiner";
    el.innerHTML = `<span class="em">${c.em}</span><span class="cn">${c.name} ×${inv[id]}</span><span class="cd2">${c.info}</span>`;
    el.onclick = (e) => { if (e.target.tagName !== "BUTTON") addToSlot(id); };  // advance
    if (c.kind === "attack" || c.kind === "shield" || c.kind === "curse"){
      const btn = document.createElement("button");
      btn.textContent = (c.kind==="attack" ? "Attack" : c.kind==="shield" ? "Shield" : "Curse") + " (1 AP)";
      btn.disabled = !canAct();
      btn.onclick = () => stage(id);
      el.appendChild(btn);
    }
    h.appendChild(el);
  });
}
function stage(id){
  const c = CARDS[id];
  if (!canAct() || !(inv[id] > 0)) return;
  inv[id]--; apSpent++;
  plan.push({ k: c.kind, card: id }); // kind is already "attack" | "shield" | "curse"
  updateUI();
}
function renderPlan(){
  const p = $("planstrip");
  if (!plan.length){ p.innerHTML = `<span class="planhint">Stage attacks/shields/curses (1 AP each), then hit Ready — both plans reveal at once.</span>`; return; }
  p.innerHTML = `<span class="planlabel">This round:</span>`;
  plan.forEach((d, idx) => {
    const c = CARDS[d.card];
    const chip = document.createElement("span");
    chip.className = "stchip " + d.k;
    chip.textContent = `${c.em} ${c.name}`;
    if (!locked){ const x=document.createElement("button"); x.textContent="✕"; x.title="cancel"; x.onclick=()=>unstage(idx); chip.appendChild(x); }
    p.appendChild(chip);
  });
}
function unstage(idx){
  if (locked) return;
  const d = plan[idx];
  inv[d.card] = (inv[d.card]||0) + 1; apSpent--;
  plan.splice(idx,1);
  updateUI();
}
function doReady(){
  if (locked || !ws || ws.readyState!==1) return;
  locked = true;
  ws.send(JSON.stringify({ type:"plan", deploys: plan.map(d=>({ k:d.k, card:d.card })) }));
  renderTimer();
  updateUI();
}
$("ready").onclick = doReady;

// ---- round countdown: auto-submits your current plan at 0 so nobody can stall ----
let timerInt = null, secsLeft = 0;
function startTimer(seconds){
  clearInterval(timerInt);
  secsLeft = seconds || 30;
  renderTimer();
  timerInt = setInterval(() => {
    if (locked){ clearInterval(timerInt); return; }
    secsLeft--;
    renderTimer();
    if (secsLeft <= 0){ clearInterval(timerInt); doReady(); }
  }, 1000);
}
function renderTimer(){
  const t = $("timer");
  if (locked || secsLeft < 0){ t.textContent = ""; return; }
  t.textContent = `⏱ 0:${String(Math.max(0, secsLeft)).padStart(2, "0")}`;
  t.style.color = secsLeft <= 5 ? "var(--foe)" : "var(--soft)";
}

// ---- the reveal: both plans flip up, then attacks resolve blow by blow ----
const sideName = (slot) => slot === myslot ? "You" : foeName;
function dmgFloat(slot, dmg){
  const s = document.getElementById("rvside" + slot); if (!s) return;
  const f = document.createElement("div"); f.className = "dmgfloat"; f.textContent = "−" + dmg;
  s.appendChild(f); setTimeout(() => f.remove(), 820);
}
async function startReveal(m){
  const events = m.events || [];
  const finish = () => {
    animating = false;
    applyPlayers(m.players); (m.logs || []).forEach(addLog);
    if (pendingOver){ const o = pendingOver; pendingOver = null; showOver(o); }
    else if (pendingRound){ const r = pendingRound; pendingRound = null; newRound(r); }
  };
  if (!events.length){ finish(); return; } // both sides did nothing — no drama to show
  animating = true;

  const R = $("reveal");
  const foeSlot = 1 - myslot, meSlot = myslot;
  const hand = { 0: [], 1: [] };
  events.forEach((e) => {
    if (e.t === "shield") hand[e.who].push({ em: CARDS[e.card].em, nm: CARDS[e.card].name, k: "shield" });
    else if (e.t === "attack") hand[e.who].push({ em: CARDS[e.card].em, nm: CARDS[e.card].name, k: "attack" });
    else if (e.t === "curse") hand[e.who].push({ em: "🌀", nm: "Curse", k: "curse" });
  });
  const hp = [shownHp[0], shownHp[1]];
  const sideHTML = (slot, cls, label) =>
    `<div class="rv-side" id="rvside${slot}"><div class="rv-name ${cls}">${label}</div>` +
    `<div class="rv-hp" id="rvhp${slot}">${hp[slot]}</div><div class="rv-cards" id="rvcards${slot}"></div></div>`;
  R.innerHTML = sideHTML(foeSlot, "foe", foeName) + `<div class="rv-mid" id="rvmid">Reveal!</div>` + sideHTML(meSlot, "me", "You");
  for (const slot of [foeSlot, meSlot]){
    const c = document.getElementById("rvcards" + slot);
    if (!hand[slot].length){ c.innerHTML = `<span style="color:var(--soft);font-size:12px">— held back —</span>`; continue; }
    hand[slot].forEach((card) => {
      const d = document.createElement("div"); d.className = "rv-card " + card.k;
      d.innerHTML = `<span class="em">${card.em}</span><span class="nm">${card.nm}</span>`;
      c.appendChild(d);
    });
  }
  R.classList.add("show");

  // flip every staged card face-up, staggered
  const cards = [...R.querySelectorAll(".rv-card")];
  cards.forEach((c, i) => setTimeout(() => c.classList.add("up"), i * 130));
  await sleep(cards.length * 130 + 500);

  // resolve, event by event
  for (const e of events){
    const mid = $("rvmid");
    if (e.t === "shield"){ mid.innerHTML = `🛡️ ${sideName(e.who)} braces ${CARDS[e.card].name}`; await sleep(520); }
    else if (e.t === "curse"){ mid.innerHTML = `🌀 ${sideName(e.who)} curses <b>${e.el}</b>`; await sleep(520); }
    else if (e.t === "attack"){
      const tgt = 1 - e.who;
      if (e.blocked){ mid.innerHTML = `${CARDS[e.card].em} ${CARDS[e.card].name} → <span class="blk">🛡️ BLOCKED</span>`; }
      else {
        hp[tgt] = Math.max(0, hp[tgt] - e.dmg);
        mid.innerHTML = `${CARDS[e.card].em} ${CARDS[e.card].name} <span class="hit">💥 −${e.dmg}</span>`;
        const hpEl = document.getElementById("rvhp" + tgt); if (hpEl) hpEl.textContent = hp[tgt];
        dmgFloat(tgt, e.dmg);
        R.classList.add("hitshake"); setTimeout(() => R.classList.remove("hitshake"), 320);
      }
      await sleep(800);
    }
  }
  await sleep(550);
  R.classList.remove("show");
  finish();
}

// ---- Guide (discovered recipes only) & Recipe Book (all) ----
const CAP = (s) => s[0].toUpperCase() + s.slice(1);
const ingredients = (c) => c.recipe.map((r) => `${EMO(r)} ${BASE[r] ? CAP(r) : CARDS[r].name}`).join(" + ");
function renderSheet(mode){
  const known = mode === "known";
  const total = Object.keys(CARDS).length;
  $("sheettitle").textContent = known ? `Your recipes · ${discovered.size}/${total}` : "Recipe Book — everything";

  const attacks = Object.entries(CARDS).filter(([id, c]) => c.kind === "attack");
  const counterRows = attacks.filter(([id]) => !known || discovered.has(id)).map(([id, c]) => {
    const s = CARDS[c.counter];
    const blk = (!known || discovered.has(c.counter)) ? `${s.em} ${s.name}` : "🔒 ???";
    return `<div class="crow"><span class="a">${c.em} ${c.name}</span><span>${c.dmg} dmg</span><span class="arrow">→ blocked by</span><span class="s">${blk}</span></div>`;
  }).join("");
  const curseRow = (!known || discovered.has("curse"))
    ? `<div class="crow"><span class="a">🌀 Curse</span><span></span><span class="arrow">→</span><span class="s">no block · locks 6s</span></div>` : "";

  const recipeRows = Object.keys(CARDS).filter((id) => !known || discovered.has(id))
    .map((id) => `<div class="rrow">${CARDS[id].em} <b>${CARDS[id].name}</b> <span class="r">= ${ingredients(CARDS[id])}</span></div>`).join("");

  const foot = known
    ? (discovered.size === 0
        ? `<p class="sheetnote">You haven't crafted anything yet — combine elements in a match and recipes appear here.</p>`
        : `<p class="sheetnote">🔒 ${total - discovered.size} of ${total} recipes still undiscovered — craft them to reveal them.</p>`)
    : `<p class="sheetnote">Bases 🔥💧🌍💨 are free. Everything else = two things you own. Craft = 1 AP, stage a card = 1 AP.</p>`;

  $("sheetbody").innerHTML =
    `<h3>Counters — what blocks what</h3>${counterRows || `<p class="sheetnote">No attacks discovered yet.</p>`}${curseRow}` +
    `<h3>Recipes</h3>${recipeRows}${foot}`;
}
function openSheet(mode){ renderSheet(mode); $("sheet").hidden = false; }
$("guide").onclick = () => openSheet("known");
$("book").onclick  = () => openSheet("all");
$("sheetclose").onclick = () => { $("sheet").hidden = true; };
$("sheet").onclick = (e) => { if (e.target === $("sheet")) $("sheet").hidden = true; };
</script>
</body>
